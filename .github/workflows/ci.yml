name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: cargo test --release

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib

  reference:
    # Renders the test files of psd-tools, ag-psd and three more PSD libraries and compares each
    # with the composite Photoshop stored.
    runs-on: ubuntu-latest
    env:
      PSD_TOOLS_COMMIT: 9e706d6ba3b5e5c91a1d0c423ff783ce3e9c363c
      AG_PSD_COMMIT: 387049670cb89b88fb8fe1b7c01aeacf98dd2e3b
      WEBTOON_PSD_COMMIT: d1a9a32ad38ff17c16f94562fc2dd47018338e78
      PSD_RB_COMMIT: d8c11365a72c8c6ef2be1281ee6982255b1953db
      PSD_RS_COMMIT: 28357a29414f940b6272b71831b3273f57f267bd
      PHOTOSHOP_API_COMMIT: 51bb741ba623a69d7a02b29e0e6645494bf4a9c6
      PSD_SDK_COMMIT: bfa117317e8bb15bfc9f76bad5800da603fddd1d
      PSD_JS_COMMIT: 7e8392d20fd5d66ad70ddda7309661b9a0ca67c8
      KRITA_COMMIT: 351297cdcec48aee3228f6c64a68d5d3b09e1796
      ASPOSE_PSD_COMMIT: 1340b4d47babd4ba582ba7c629666aeedfdc03b4
      OOV_PSD_COMMIT: a5d50ec0acac8b2f47d16ead6a1190a0352f2299
      ARTAL_COMMIT: 1edd7aafbe40a6b1c491e0ac086ac9648a931c10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the psd-tools test files
        run: |
          git init -q psd-tools
          git -C psd-tools remote add origin https://github.com/psd-tools/psd-tools.git
          git -C psd-tools fetch -q --depth 1 origin "$PSD_TOOLS_COMMIT"
          git -C psd-tools checkout -q FETCH_HEAD
      - name: Fetch the ag-psd test files
        # Files written by ag-psd itself (test/write, expected.psd) carry no Photoshop composite.
        run: |
          git init -q ag-psd
          git -C ag-psd remote add origin https://github.com/Agamnentzar/ag-psd.git
          git -C ag-psd fetch -q --depth 1 origin "$AG_PSD_COMMIT"
          git -C ag-psd checkout -q FETCH_HEAD
          rm -rf ag-psd/test/write
          find ag-psd -name 'expected.ps[db]' -delete
      - name: Fetch the test files of other PSD libraries
        # webtoon/psd's errors directory holds deliberately broken files.
        run: |
          fetch() {
            git init -q "$1"
            git -C "$1" remote add origin "https://github.com/$2.git"
            git -C "$1" fetch -q --depth 1 origin "$3"
            git -C "$1" checkout -q FETCH_HEAD
          }
          fetch webtoon-psd webtoon/psd "$WEBTOON_PSD_COMMIT"
          fetch psd-rb layervault/psd.rb "$PSD_RB_COMMIT"
          fetch psd-rs chinedufn/psd "$PSD_RS_COMMIT"
          fetch photoshop-api EmilDohne/PhotoshopAPI "$PHOTOSHOP_API_COMMIT"
          fetch psd-sdk MolecularMatters/psd_sdk "$PSD_SDK_COMMIT"
          fetch psd-js meltingice/psd.js "$PSD_JS_COMMIT"
          fetch oov-psd oov/psd "$OOV_PSD_COMMIT"
          # Only oov/psd's files saved by Photoshop: the others were written by other painting apps.
          rm -rf oov-psd/composite
          (cd oov-psd/testdata && rm -f benchmark.psd mod.psd ibispaint.psd photopea.psd sketchbook.psd rgb8bit_nobg_transparent_medibang.psd)
          fetch artal EvineDev/Artal "$ARTAL_COMMIT"
          rm -rf webtoon-psd/packages/psd/tests/integration/fixtures/errors
          # Only Krita's PSD test files, not the whole tree.
          git init -q krita
          git -C krita remote add origin https://invent.kde.org/graphics/krita.git
          git -C krita sparse-checkout set --no-cone /plugins/impex/psd/tests/data/
          git -C krita fetch -q --depth 1 --filter=blob:none origin "$KRITA_COMMIT"
          git -C krita checkout -q FETCH_HEAD
          # Only Aspose.PSD's example files. Those its examples wrote back (Changed, Added, Edited,
          # Merged, Flattened, _out) carry Aspose's composite, not Photoshop's, as do CropTest (with
          # Aspose's evaluation watermark) and ImageWithTextLayer (a text layer Aspose wrote).
          git init -q aspose-psd
          git -C aspose-psd remote add origin https://github.com/aspose-psd/Aspose.PSD-for-.NET.git
          git -C aspose-psd sparse-checkout set --no-cone '/Examples/Data/PSD/*.psd' '/Examples/Data/PSD/*.psb'
          git -C aspose-psd fetch -q --depth 1 --filter=blob:none origin "$ASPOSE_PSD_COMMIT"
          git -C aspose-psd checkout -q FETCH_HEAD
          find aspose-psd -iregex '.*\(changed\|added\|edited\|merged\|flattened\|_out\|croptest\|imagewithtextlayer\).*' -delete
      - run: cargo test --release --test reference -- --nocapture
        env:
          PSDC_REFERENCE_DIR: psd-tools/tests/psd_files:ag-psd:webtoon-psd:psd-rb:psd-rs:photoshop-api:psd-sdk:psd-js:krita/plugins/impex/psd/tests/data:aspose-psd/Examples/Data/PSD:oov-psd/testdata:artal/tests/cases
