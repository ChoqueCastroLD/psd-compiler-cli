name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: cargo test --release

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib

  reference:
    # Renders every psd-tools and ag-psd test file and compares it with the composite Photoshop
    # stored.
    runs-on: ubuntu-latest
    env:
      PSD_TOOLS_COMMIT: 9e706d6ba3b5e5c91a1d0c423ff783ce3e9c363c
      AG_PSD_COMMIT: 387049670cb89b88fb8fe1b7c01aeacf98dd2e3b
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the psd-tools test files
        run: |
          git init -q psd-tools
          git -C psd-tools remote add origin https://github.com/psd-tools/psd-tools.git
          git -C psd-tools fetch -q --depth 1 origin "$PSD_TOOLS_COMMIT"
          git -C psd-tools checkout -q FETCH_HEAD
      - name: Fetch the ag-psd test files
        # Files written by ag-psd itself (test/write, expected.psd) carry no Photoshop composite.
        run: |
          git init -q ag-psd
          git -C ag-psd remote add origin https://github.com/Agamnentzar/ag-psd.git
          git -C ag-psd fetch -q --depth 1 origin "$AG_PSD_COMMIT"
          git -C ag-psd checkout -q FETCH_HEAD
          rm -rf ag-psd/test/write
          find ag-psd -name 'expected.ps[db]' -delete
      - run: cargo test --release --test reference -- --nocapture
        env:
          PSDC_REFERENCE_DIR: psd-tools/tests/psd_files:ag-psd
