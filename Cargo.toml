[package]
name = "psd-compiler"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Compile Photoshop PSD/PSB files to PNG headlessly, re-rendering text layers with Photoshop fidelity."
license = "MIT"
repository = "https://github.com/ChoqueCastroLD/psd-compiler-cli"
readme = "README.md"
keywords = ["psd", "photoshop", "png", "renderer", "cli"]
categories = ["command-line-utilities", "graphics", "multimedia::images"]
exclude = ["docs/assets/*.psd"]

[lib]
name = "psd_compiler"
path = "src/lib.rs"

[[bin]]
name = "psdc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
image-webp = "0.2"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"
mimalloc = { version = "0.1", default-features = false }
moxcms = "0.8"
png = "0.17"
rayon = "1"
ravif = { version = "0.13", default-features = false, features = ["threading"], optional = true }
rustybuzz = "0.20"
tiny-skia = "0.11"

[features]
default = []
# AVIF output (pure-Rust rav1e encoder; adds build time).
avif = ["dep:ravif"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
